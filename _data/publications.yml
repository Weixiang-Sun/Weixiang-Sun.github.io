# Publications shown on the home page (selected) and on /publications/.
# Order matters: papers are grouped by year, and keep this order inside each year.
#
#   title, authors, year, venue      required. Mark equal contribution with * and the
#                                    corresponding author with † at the end of a name.
#   et_al: true                      the author list is truncated.
#   venue_note                       small text after the venue, e.g. "Main · Oral".
#   status                           published | under_review | preprint
#   bib_type                         conf | workshop | journal | preprint | review (BibTeX entry type)
#   bib_venue                        full booktitle / journal for BibTeX.
#   volume, pages, venue_detail      optional details (venue_detail is shown under the authors).
#   arxiv, website, code             links. website = project page.
#   first_author: true               counts for the "First author" filter.
#   figure                           file name in assets/img/pubs/ without ".webp".
#   figure_size: [width, height]     optional; lets a tall figure get a tall frame before it loads.
#   figure_caption                   shown when the figure is enlarged.
#   short_title                      used on the placeholder when there is no figure.
#   selected: true + summary         shows the paper under "Selected papers" on the home page.

