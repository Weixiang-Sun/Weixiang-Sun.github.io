- title: Research Summary
  type: nested_list
  contents:
    - title: I aim to build a science of <b>AI&ndash;AI interaction</b>. HCI and HAI study how people interact with computers and AI; as AI agents increasingly collaborate with, evaluate, and stand in for one another, I study them the way sociology studies people, from the individual <b>agent</b> to <b>micro</b>-level interaction to <b>macro</b>-level societies. A recurring lesson is that what holds for one agent does not hold for many&#58; collaboration between agents is not free and does not always pay off, interaction can erode the diversity that makes a group valuable, and agents standing in for people flatten the variety of real populations. I want to understand these dynamics well enough to make systems of many AI agents reliable and safe.
      items:
        - <b>Agent.</b> How one agent plans, acts, and learns&#58; computer-use agents in production (Li Auto), long-horizon planning, self-evolving agents, and agents that serve people in social services.
        - <b>Micro.</b> How agents shape each other&#58; when collaboration pays off, how interaction shapes collective output, and multi-agent systems for creative and scientific work; as a human reference, how manipulation unfolds in conversation.
        - <b>Macro.</b> How agent populations behave and stand in for people&#58; how faithfully LLMs simulate individuals and social roles, and simulating how policies play out across populations.

